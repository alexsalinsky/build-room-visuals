<!DOCTYPE html>

  DO NOT modify threads-burn-files-remain.html.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }

  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }

  .caption { max-width: 940px; text-align: center; font-size: 17px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 66px; }
  .cap-en { display: block; }
  .cap-es { display: block; font-size: 14px; color: #2563eb; font-style: italic; margin-top: 4px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }
  footer { position: fixed; bottom: 6px; left: 16px; font-size: 11px; color: #999; }

  /* Language toggle */
  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  /* Mode-based visibility */
  body.mode-en .cap-es { display: none; }
  body.mode-en .title-es { display: none; }
  body.mode-es .cap-en { display: none; }
  body.mode-es .title-screen > span.title-en { display: none; }

  .scene { display: none; }
  .scene.active { display: block; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-soft { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; }
  .box-finale { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2.5; }
  .line-thin { fill: none; stroke: #d1d5db; stroke-width: 1.5; }
  .line-mid  { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
  .highlight { fill: #fde68a; stroke: #92400e; stroke-width: 2.5; }
  .ember     { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
  .bubble-user { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2; }
  .bubble-ai   { fill: #fffbe8; stroke: #92400e; stroke-width: 2; }
  .crossed   { stroke: #b91c1c; stroke-width: 4; stroke-linecap: round; }

  .head-xl { font-size: 28px; font-weight: 700; fill: #1a1a1a; letter-spacing: 0.5px; }
  .head-md { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
  .head-md-white { font-size: 18px; font-weight: 700; fill: #fff; }

  .label-sm { font-size: 12px; font-weight: 400; fill: #666; }
  .label-sm-white { font-size: 12px; font-weight: 400; fill: #d1d5db; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 500; fill: #1a1a1a; }

</style>

    <!-- =========== SCENE 4: the four rule-pack docs glow =========== -->

    <svg class="scene" data-scene="5" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet">
      <text x="550" y="32" text-anchor="middle" class="head-xl">Why <tspan style="font-family:ui-monospace,Menlo,monospace; fill:#92400e">.md</tspan> ? Why <tspan style="font-family:ui-monospace,Menlo,monospace; fill:#92400e">CLAUDE.md</tspan> ?</text>
      <text x="550" y="55" text-anchor="middle" class="head-es">&#xBF;Por qu&#xE9; <tspan style="font-family:ui-monospace,Menlo,monospace">.md</tspan>? &#xBF;Por qu&#xE9; <tspan style="font-family:ui-monospace,Menlo,monospace">CLAUDE.md</tspan>?</text>
      <text x="550" y="76" text-anchor="middle" class="label-sm">The format matters as much as the existence.</text>
      <text x="550" y="90" text-anchor="middle" class="label-es">El formato importa tanto como el hecho de que existan.</text>

      <!-- Top-left: machine-first -->
      <rect x="60" y="100" width="490" height="270" rx="12" class="box"/>
      <text x="80" y="132" class="head-md">1. Machine-first format</text>
      <text x="80" y="152" class="head-md-es">Formato pensado para la m&#xE1;quina</text>
      <line x1="80" y1="166" x2="530" y2="166" class="line-thin"/>
      <text x="80" y="192" class="label-b">Plain text. No rendering tax. No tags.</text>
      <text x="80" y="207" class="label-es">Texto plano. Sin costo de renderizado. Sin etiquetas.</text>
      <text x="80" y="228" class="label-b">LLMs are trained on tons of markdown.</text>
      <text x="80" y="243" class="label-es">Los LLM se entrenaron con toneladas de markdown.</text>
      <text x="80" y="264" class="label-b">Lighter than .docx, lighter than HTML.</text>
      <text x="80" y="279" class="label-es">M&#xE1;s liviano que .docx y que HTML.</text>
      <text x="80" y="300" class="label-b">The model reads it directly, fast and cheap.</text>
      <text x="80" y="315" class="label-es">El modelo lo lee directo, r&#xE1;pido y barato.</text>
      <text x="80" y="342" class="label-sm" style="font-style:italic">It's the right shape for AI to consume.</text>
      <text x="80" y="357" class="label-es">Es la forma correcta para que la IA lo consuma.</text>

      <!-- Top-right: human-readable -->
      <rect x="570" y="100" width="490" height="270" rx="12" class="box"/>
      <text x="590" y="132" class="head-md">2. Still human-readable</text>
      <text x="590" y="152" class="head-md-es">Sigue siendo legible para humanos</text>
      <line x1="590" y1="166" x2="1040" y2="166" class="line-thin"/>
      <text x="590" y="192" class="label-b">Any text editor opens it. Forever.</text>
      <text x="590" y="207" class="label-es">Cualquier editor de texto lo abre. Para siempre.</text>
      <text x="590" y="228" class="label-b">A teammate can read it without tools.</text>
      <text x="590" y="243" class="label-es">Alguien de tu equipo lo lee sin instalar nada.</text>
      <text x="590" y="264" class="label-b">You in three months can read it.</text>
      <text x="590" y="279" class="label-es">T&#xFA;, en tres meses, lo vas a entender.</text>
      <text x="590" y="300" class="label-b">Anyone in 2040 can read it.</text>
      <text x="590" y="315" class="label-es">Cualquiera en 2040 lo va a poder leer.</text>
      <text x="590" y="342" class="label-sm" style="font-style:italic">Format won't rot. Files won't go obsolete.</text>
      <text x="590" y="357" class="label-es">El formato no se pudre. Los archivos no quedan obsoletos.</text>

      <!-- Bottom-left: CLAUDE.md is a convention -->

<script>
const captionsEN = [
  "An app is just files. A website is just files. Your build is files too.",
  "Most people picture building as a conversation. That's only half of it.",
  "Underneath the chat, real files are appearing on your computer. That's what your build actually is.",
  "Four of those files keep the project alive between sessions. The rule-pack tells Codex to write them without being asked.",
  "And the format matters. Markdown is machine-first, human-readable, plays nice with the conventions every AI tool already follows.",
  "When the thread breaks, when Codex gets confused, when you have to start over: the files are still there.",
  "Open a fresh thread. Paste PROJECT.md as the first message. The new conversation picks up exactly where the old one stopped.",
  "The thread is the conversation. The files are the project. Build accordingly."
];

const captionsES = [
  "Una app son archivos. Un sitio web son archivos. Lo que construyes tambi\xE9n son archivos.",
  "La mayor\xEDa se imagina que construir es una conversaci\xF3n. Eso es solo la mitad.",
  "Debajo del chat aparecen archivos reales en tu computador. Eso es de verdad lo que est\xE1s construyendo.",
  "Cuatro de esos archivos mantienen vivo el proyecto entre sesiones. El paquete de reglas hace que Codex los escriba sin que se lo pidas.",
  "Y el formato importa. Markdown est\xE1 hecho para la m\xE1quina, sigue siendo legible para humanos, y encaja con las convenciones que ya siguen las herramientas de IA.",
  "Cuando el hilo se rompe, cuando Codex se enreda, cuando toca empezar de nuevo: los archivos siguen ah\xED.",
  "Abre un hilo nuevo. Pega PROJECT.md como primer mensaje. La conversaci\xF3n nueva retoma justo donde par\xF3 la anterior.",
  "El hilo es la conversaci\xF3n. Los archivos son el proyecto. Construye en consecuencia."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const scenes = document.querySelectorAll(".scene");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#1a1a1a;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    scenes.forEach(s => s.classList.remove('active'));
  } else {
    titleScreen.style.display = 'none';
    scenes.forEach(s => {
      const step = parseInt(s.dataset.scene);
      s.classList.toggle('active', step === i + 1);
    });
  }

  // Show/hide ES layers inside the SVG scenes
  document.querySelectorAll('.head-es, .head-md-es, .label-es, .label-es-white').forEach(el => {
    if (el.closest('svg')) el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

// Basic touch swipe
let touchStartX = null;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 40) { if (dx < 0) next.click(); else prev.click(); }
  touchStartX = null;
}, { passive: true });

render();
</script>
