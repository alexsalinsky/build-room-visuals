<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Where Your Build Lives / &#xBF;D&#xF3;nde vive tu build?</title>
<!--
  Bilingual twin of where-your-build-lives.html. English primary, Spanish beneath
  (smaller / italic / blue). Fixed top-right EN | EN+ES | ES toggle. Default: Both.
  S3 lesson block for the HvR2 Night Cohort (bilingual) and Morning Cohort (Spanish).
  DO NOT modify where-your-build-lives.html.
  Finale panel is cream + gold, not a black box (house rule).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .title-screen { font-size: 54px; font-weight: 700; text-align: center; color: #1a1a1a; letter-spacing: -1px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .title-es { display: block; font-size: 34px; font-weight: 400; color: #2563eb; font-style: italic; margin-top: 12px; letter-spacing: -0.5px; line-height: 1.15; }
  .caption { max-width: 940px; text-align: center; font-size: 17px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 66px; }
  .cap-en { display: block; }
  .cap-es { display: block; font-size: 14px; color: #2563eb; font-style: italic; margin-top: 4px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }
  footer { position: fixed; bottom: 6px; left: 16px; font-size: 11px; color: #999; }

  /* Language toggle */
  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  /* Mode-based visibility */
  body.mode-en .cap-es { display: none; }
  body.mode-en .title-es { display: none; }
  body.mode-es .cap-en { display: none; }
  body.mode-es .title-screen > span.title-en { display: none; }

  .el { opacity: 0; transition: opacity 0.35s ease; }
  .el.show { opacity: 1; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-finale { fill: #F7F4EE; stroke: #C9932F; stroke-width: 3; }
  .badge { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
  .line-thin { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
  .head-card { font-size: 18px; font-weight: 700; fill: #1a1a1a; letter-spacing: 0.5px; }
  .row-label { font-size: 12px; font-weight: 700; fill: #92400e; letter-spacing: 0.5px; }
  .label-b { font-size: 13px; font-weight: 400; fill: #1a1a1a; }
  .label-b-bold { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .label-sm { font-size: 12px; font-weight: 400; fill: #555; }
  .label-h-ink { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
  .label-b-ink { font-size: 15px; font-weight: 400; fill: #333; }

  /* Spanish layers inside the SVG */
  .head-es { font-size: 19px; font-weight: 400; font-style: italic; fill: #2563eb; }
  .head-card-es { font-size: 12.5px; font-weight: 400; font-style: italic; fill: #1d4ed8; letter-spacing: 0.3px; }
  .label-es { font-size: 11.5px; font-weight: 400; font-style: italic; fill: #2563eb; }
  .label-es-lg { font-size: 15px; font-weight: 400; font-style: italic; fill: #2563eb; }
</style>
</head>
<body class="mode-both">

<div class="lang-toggle">
  <button onclick="setMode('en')" id="btn-en">EN</button>
  <button onclick="setMode('both')" id="btn-both" class="active">EN+ES</button>
  <button onclick="setMode('es')" id="btn-es">ES</button>
</div>

<div class="stage">
  <div class="frame-wrap" id="frame">

    <div class="title-screen" id="titleScreen">
      <span class="title-en">Where does<br/>your build live?</span>
      <span class="title-es">&#xBF;D&#xF3;nde vive<br/>tu build?</span>
      <span class="sub">Humans V Robots</span>
    </div>

    <svg id="diagram" viewBox="0 0 1100 900" preserveAspectRatio="xMidYMid meet" style="display:none">

      <!-- Header, visible from step 2 on -->
      <g class="el" data-step="2">
        <text x="550" y="30" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1a1a1a">Where does your build live?</text>
        <text x="550" y="53" text-anchor="middle" class="head-es">&#xBF;D&#xF3;nde vive tu build?</text>
        <text x="550" y="74" text-anchor="middle" class="label-sm">Three places. Each works for different things.</text>
        <text x="550" y="89" text-anchor="middle" class="label-es">Tres lugares. Cada uno sirve para cosas distintas.</text>
      </g>

      <!-- STEP 2: three empty cards with header labels only -->
      <g class="el" data-step="2">
        <!-- INSIDE CLAUDE -->
        <rect x="30" y="100" width="340" height="595" rx="12" class="box"/>
        <rect x="50" y="110" width="300" height="52" rx="26" class="badge"/>
        <text x="200" y="132" text-anchor="middle" class="head-card">INSIDE CLAUDE</text>
        <text x="200" y="152" text-anchor="middle" class="head-card-es">DENTRO DE CLAUDE</text>

        <!-- OUTSIDE CLAUDE -->
        <rect x="380" y="100" width="340" height="595" rx="12" class="box"/>
        <rect x="400" y="110" width="300" height="52" rx="26" class="badge"/>
        <text x="550" y="132" text-anchor="middle" class="head-card">OUTSIDE CLAUDE</text>
        <text x="550" y="152" text-anchor="middle" class="head-card-es">FUERA DE CLAUDE</text>

        <!-- HYBRID -->
        <rect x="730" y="100" width="340" height="595" rx="12" class="box"/>
        <rect x="750" y="110" width="300" height="52" rx="26" class="badge"/>
        <text x="900" y="132" text-anchor="middle" class="head-card">HYBRID</text>
        <text x="900" y="152" text-anchor="middle" class="head-card-es">H&#xCD;BRIDO</text>
      </g>

      <!-- STEP 3: fill INSIDE CLAUDE -->
      <g class="el" data-step="3">
        <text x="50" y="192" class="row-label">FORMS / FORMAS</text>
        <text x="50" y="214" class="label-b">Project &#xB7; Artifact &#xB7; Custom GPT</text>
        <text x="50" y="230" class="label-es">Proyecto &#xB7; Artefacto &#xB7; GPT personalizado</text>

        <line x1="50" y1="246" x2="350" y2="246" class="line-thin"/>
        <text x="50" y="272" class="row-label">PROS</text>
        <text x="50" y="294" class="label-b">&#x2022; Fastest to build</text>
        <text x="50" y="310" class="label-es">&#x2022; Lo m&#xE1;s r&#xE1;pido de construir</text>
        <text x="50" y="332" class="label-b">&#x2022; Share via Claude Team</text>
        <text x="50" y="348" class="label-es">&#x2022; Se comparte por Claude Team</text>

        <text x="50" y="378" class="row-label">CONS / CONTRAS</text>
        <text x="50" y="400" class="label-b">&#x2022; Only runs when someone</text>
        <text x="50" y="418" class="label-b">&#xA0;&#xA0; opens Claude</text>
        <text x="50" y="434" class="label-es">&#x2022; Solo corre cuando alguien</text>
        <text x="50" y="450" class="label-es">&#xA0;&#xA0; abre Claude</text>

        <line x1="50" y1="468" x2="350" y2="468" class="line-thin"/>
        <text x="50" y="494" class="row-label">EXAMPLES / EJEMPLOS</text>
        <text x="50" y="516" class="label-b">&#x2022; Shared dashboard</text>
        <text x="50" y="532" class="label-es">&#x2022; Tablero compartido</text>
        <text x="50" y="554" class="label-b">&#x2022; Team prompt library</text>
        <text x="50" y="570" class="label-es">&#x2022; Librer&#xED;a de prompts del equipo</text>
        <text x="50" y="592" class="label-b">&#x2022; Internal Q&amp;A</text>
        <text x="50" y="608" class="label-es">&#x2022; Preguntas internas del equipo</text>
      </g>

      <!-- STEP 4: fill OUTSIDE CLAUDE -->
      <g class="el" data-step="4">
        <text x="400" y="192" class="row-label">FORMS / FORMAS</text>
        <text x="400" y="214" class="label-b">Server &#xB7; Scheduled job &#xB7; App &#xB7; Bot</text>
        <text x="400" y="230" class="label-es">Servidor &#xB7; Tarea programada &#xB7; App &#xB7; Bot</text>

        <line x1="400" y1="246" x2="700" y2="246" class="line-thin"/>
        <text x="400" y="272" class="row-label">PROS</text>
        <text x="400" y="294" class="label-b">&#x2022; Runs without you</text>
        <text x="400" y="310" class="label-es">&#x2022; Corre sin ti</text>
        <text x="400" y="332" class="label-b">&#x2022; On a schedule</text>
        <text x="400" y="348" class="label-es">&#x2022; En un horario fijo</text>
        <text x="400" y="370" class="label-b">&#x2022; Sends to email / WhatsApp</text>
        <text x="400" y="386" class="label-es">&#x2022; Te llega al correo o a WhatsApp</text>

        <text x="400" y="416" class="row-label">CONS / CONTRAS</text>
        <text x="400" y="438" class="label-b">&#x2022; More setup</text>
        <text x="400" y="454" class="label-es">&#x2022; M&#xE1;s configuraci&#xF3;n</text>
        <text x="400" y="476" class="label-b">&#x2022; You manage the server</text>
        <text x="400" y="492" class="label-es">&#x2022; T&#xFA; manejas el servidor</text>

        <line x1="400" y1="510" x2="700" y2="510" class="line-thin"/>
        <text x="400" y="536" class="row-label">EXAMPLES / EJEMPLOS</text>
        <text x="400" y="558" class="label-b">&#x2022; Daily WhatsApp briefing</text>
        <text x="400" y="574" class="label-es">&#x2022; Resumen diario por WhatsApp</text>
        <text x="400" y="596" class="label-b">&#x2022; Weekly report</text>
        <text x="400" y="612" class="label-es">&#x2022; Reporte semanal</text>
        <text x="400" y="634" class="label-b">&#x2022; Always-on assistant</text>
        <text x="400" y="650" class="label-es">&#x2022; Asistente siempre encendido</text>
      </g>

      <!-- STEP 5: fill HYBRID -->
      <g class="el" data-step="5">
        <text x="750" y="192" class="row-label">FORMS / FORMAS</text>
        <text x="750" y="212" class="label-b">Claude does the thinking,</text>
        <text x="750" y="229" class="label-b">output goes to Monday /</text>
        <text x="750" y="246" class="label-b">Slack / email</text>
        <text x="750" y="264" class="label-es">Claude piensa, y el resultado</text>
        <text x="750" y="280" class="label-es">llega a Monday, a Slack</text>
        <text x="750" y="296" class="label-es">o al correo</text>

        <line x1="750" y1="314" x2="1050" y2="314" class="line-thin"/>
        <text x="750" y="340" class="row-label">PROS</text>
        <text x="750" y="362" class="label-b">&#x2022; Human-in-the-loop</text>
        <text x="750" y="378" class="label-es">&#x2022; Con una persona en el medio</text>
        <text x="750" y="400" class="label-b">&#x2022; Less server work</text>
        <text x="750" y="416" class="label-es">&#x2022; Menos trabajo de servidor</text>

        <text x="750" y="446" class="row-label">CONS / CONTRAS</text>
        <text x="750" y="468" class="label-b">&#x2022; You trigger it manually</text>
        <text x="750" y="484" class="label-es">&#x2022; T&#xFA; lo disparas a mano</text>

        <line x1="750" y1="502" x2="1050" y2="502" class="line-thin"/>
        <text x="750" y="528" class="row-label">EXAMPLE / EJEMPLO</text>
        <text x="750" y="550" class="label-b">&#x2022; A Claude project that</text>
        <text x="750" y="568" class="label-b">&#xA0;&#xA0; emails a draft report</text>
        <text x="750" y="586" class="label-b">&#xA0;&#xA0; to your team lead</text>
        <text x="750" y="604" class="label-es">&#x2022; Un proyecto de Claude que</text>
        <text x="750" y="620" class="label-es">&#xA0;&#xA0; le manda un borrador de</text>
        <text x="750" y="636" class="label-es">&#xA0;&#xA0; reporte a tu l&#xED;der de equipo</text>
      </g>

      <!-- STEP 6: finale -->
      <g class="el" data-step="6">
        <rect x="40" y="715" width="1020" height="165" rx="14" class="box-finale"/>
        <text x="550" y="750" text-anchor="middle" class="label-h-ink">Pick one for your First Brick.</text>
        <text x="550" y="774" text-anchor="middle" class="label-es-lg">Escoge uno para tu First Brick.</text>
        <text x="550" y="806" text-anchor="middle" class="label-b-ink">Run while you sleep? OUTSIDE. Share with the team today? INSIDE.</text>
        <text x="550" y="823" text-anchor="middle" class="label-es">&#xBF;Que corra mientras duermes? FUERA. &#xBF;Compartir hoy con el equipo? DENTRO.</text>
        <text x="550" y="849" text-anchor="middle" class="label-b-ink">Not sure? HYBRID. You can always move it later.</text>
        <text x="550" y="866" text-anchor="middle" class="label-es">&#xBF;No est&#xE1;s seguro? H&#xCD;BRIDO. Siempre lo puedes mover despu&#xE9;s.</text>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">6</span></div>
  </div>
</div>
<div class="hint">&#x2190; &#x2192; arrow keys also work</div>
<footer>Alex Salinsky / Humans V Robots</footer>

<script>
const captionsEN = [
  "Where does your build live? Three options.",
  "Three places your build can live. Each works for different things.",
  "INSIDE Claude is fastest. Good for team-shared dashboards and prompt libraries. But it only runs when someone opens Claude.",
  "OUTSIDE Claude runs on its own and sends results to you. Good for always-on tools. More setup.",
  "HYBRID is the middle ground. Claude does the thinking, the output lands in Monday or Slack. You still trigger it, but the result is shareable.",
  "Pick one for your First Brick. You can always move it later. Don't overthink it."
];

const captionsES = [
  "\xBFD\xF3nde vive tu build? Tres opciones.",
  "Tres lugares donde puede vivir tu build. Cada uno sirve para cosas distintas.",
  "DENTRO de Claude es lo m\xE1s r\xE1pido. Sirve para tableros compartidos y librer\xEDas de prompts del equipo. Pero solo corre cuando alguien abre Claude.",
  "FUERA de Claude corre solo y te manda el resultado. Sirve para herramientas que trabajan sin ti. Pide m\xE1s configuraci\xF3n.",
  "H\xCDBRIDO es el punto medio. Claude piensa, y el resultado aterriza en Monday o en Slack. T\xFA lo disparas, pero el resultado se puede compartir.",
  "Escoge uno para tu First Brick. Siempre lo puedes mover despu\xE9s. No le des tantas vueltas."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#1a1a1a;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }

  // Show/hide ES layers inside the SVG
  document.querySelectorAll('.head-es, .head-card-es, .label-es, .label-es-lg').forEach(el => {
    if (el.closest('svg')) el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

// Basic touch swipe
let touchStartX = null;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 40) { if (dx < 0) next.click(); else prev.click(); }
  touchStartX = null;
}, { passive: true });

render();
</script>
</body>
</html>
