<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown Card · The Build Room · 1200x1200</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #fafafa;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 72px 80px 56px;
  }
  .pill {
    align-self: flex-start;
    background: #1a1a1a; color: #fff;
    padding: 10px 26px; border-radius: 30px;
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 56px;
  }
  .block {
    flex: 1;
    background: #fef3e0;
    border: 2px solid #1a1a1a;
    border-radius: 16px;
    padding: 56px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mo {
    font-size: 30px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
  }
  .num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 400px;
    line-height: 0.92;
    letter-spacing: -8px;
  }
  .lines {
    margin-top: 40px;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.14;
  }
  .lines span { display: block; }
  .band {
    margin-top: 48px;
    background: #1a1a1a;
    border-radius: 14px;
    padding: 26px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .band .label {
    color: #fff; font-size: 26px; font-weight: 700; letter-spacing: 0.5px;
  }
  .chip {
    background: #fff; color: #1a1a1a;
    border-radius: 30px;
    padding: 12px 28px;
    font-size: 28px; font-weight: 700;
  }
  .footer {
    margin-top: 36px;
    text-align: center;
    font-size: 20px; font-weight: 700; color: #888; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="pill">THE BUILD ROOM</div>
  <div class="block">
    <div class="mo">Jul</div>
    <div class="num">15</div>
    <div class="lines">
      <span>Kickoff Session.</span>
      <span>Tomorrow. Free.</span>
    </div>
  </div>
  <div class="band">
    <div class="label">Register:</div>
    <div class="chip">luma.com/rnmkpxoc</div>
  </div>
  <div class="footer">Alex Salinsky / The Build Room</div>
</body>
</html>
