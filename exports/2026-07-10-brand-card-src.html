<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>35 Hours Card · The Build Room · 1200x1200</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #fafafa;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 72px 80px 56px;
  }
  .pill {
    align-self: flex-start;
    background: #1a1a1a; color: #fff;
    padding: 10px 26px; border-radius: 30px;
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 64px;
  }
  .block {
    flex: 1;
    background: #e0f2fe;
    border: 2px solid #1a1a1a;
    border-radius: 16px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 380px;
    line-height: 0.9;
    letter-spacing: -8px;
  }
  .lines {
    margin-top: 44px;
    font-size: 66px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.16;
  }
  .lines span { display: block; }
  .sub {
    margin-top: 36px;
    font-size: 26px;
    color: #666;
    line-height: 1.4;
  }
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 20px; font-weight: 700; color: #888; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="pill">THE BUILD ROOM</div>
  <div class="block">
    <div class="num">35</div>
    <div class="lines">
      <span>hours a month.</span>
      <span>One tool. Four weeks.</span>
    </div>
    <div class="sub">Built by a campaign manager at a 9-person PR agency, demo'd live at her team's Demo Day.</div>
  </div>
  <div class="footer">Alex Salinsky / The Build Room</div>
</body>
</html>
