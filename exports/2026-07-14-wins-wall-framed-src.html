<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wins Wall Framed · The Build Room · 1200x1200</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #fafafa;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 64px 80px 48px;
  }
  .pill {
    align-self: flex-start;
    background: #1a1a1a; color: #fff;
    padding: 10px 26px; border-radius: 30px;
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 36px;
  }
  .shot {
    flex: 1;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    background: #fafafa;
  }
  .shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 20px; font-weight: 700; color: #888; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="pill">THE BUILD ROOM &middot; WINS WALL</div>
  <div class="shot"><img src="wins-wall-shot-raw.png" alt=""></div>
  <div class="footer">alexsalinsky.github.io/build-room-visuals/wins-wall.html</div>
</body>
</html>
