<script>
const captionsEN = [
  "Dream big, build small. This is how we approach every project.",
  "Start with the dream. What do you really want? Don't filter yet.",
  "A few real dreams. Big, ambitious, useful. The dream is where the energy is.",
  "Then we work backwards. We don't try to build the whole dream today. We design backwards from it.",
  "First stop: the MVP. The smallest version that proves the idea can work. One user. One slice. Real output.",
  "Then the FIRST BRICK. The smallest component you can build TODAY. One connection. One output. End to end.",
  "Roughly 4 hours of building. That's our scope. Anything bigger gets cut. Anything smaller doesn't prove anything.",
  "Same approach when you prompt AI. Tell it your dream. Then plan the smallest piece. Then build the fastest prototype. Planning is half the work."
];

const captionsES = [
  "Suena en grande, construye en chico. As\xED abordamos cada proyecto.",
  "Empieza con el sue\xF1o. \xBFQu\xE9 es lo que realmente quieres? No te limites todav\xEDa.",
  "Unos sue\xF1os reales. Grandes, ambiciosos, \xFAtiles. El sue\xF1o es donde est\xE1 la energ\xEDa.",
  "Luego trabajamos al rev\xE9s. No intentamos construir todo el sue\xF1o hoy. Dise\xF1amos desde \xE9l hacia atr\xE1s.",
  "Primera parada: el MVP. La versi\xF3n m\xEDs peque\xF1a que demuestra que la idea puede funcionar. Un usuario. Un corte. Resultado real.",
  "Luego el PRIMER LADRILLO. El componente m\xE1s peque\xF1o que puedes construir HOY. Una conexi\xF3n. Un resultado. De punta a punta.",
  "Aproximadamente 4 horas de construcci\xF3n. Ese es nuestro alcance. Cualquier cosa mayor se recorta. Cualquier cosa menor no demuestra nada.",
  "Lo mismo cuando haces prompts. Cu\xE9ntale tu sue\xF1o. Luego planea la pieza m\xE1s peque\xF1a. Luego construye el prototipo m\xE1s r\xE1pido. Planear es la mitad del trabajo."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#FFFFFF;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }

  document.querySelectorAll('#diagram .label-es, #diagram .label-es-white').forEach(el => {
    el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
