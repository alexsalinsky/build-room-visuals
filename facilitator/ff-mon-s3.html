<!DOCTYPE html>
<!--
  F&F Mon Cohort, Session 3: Become a Publisher (2026-07-07)
  Built from _template/deck-template.html. Opener (thesis + agreements) built in.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 3 · Become a Publisher: The Build Room</title>
<style>
  :root {
    --br-text: #1a1a1a;
    --br-bg: #fafafa;
    --br-card-bg: #ffffff;
    --br-gray-1: #444;
    --br-gray-3: #666;
    --br-gray-4: #888;
    --br-gray-5: #999;
    --br-rule: #ddd;
    --br-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    --br-h1: 68px;
    --br-h2: 36px;
    --br-h3: 22px;
    --br-body: 20px;
    --br-lead: 26px;
    --br-meta: 14px;
    --br-space-2: 14px;
    --br-space-4: 24px;
    --br-border: 2.5px solid var(--br-text);
    --br-border-thin: 1.5px solid var(--br-text);
    --br-radius-sm: 6px;
    --br-radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--br-bg);
    color: var(--br-text);
    font-family: var(--br-font);
    overflow: hidden;
  }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .slide-wrap { flex: 1; max-height: 88vh; width: 100%; max-width: 1100px; display: flex; align-items: center; justify-content: center; padding: 32px 32px 96px; position: relative; }
  .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .slide.center { align-items: center; text-align: center; }

  .section-chip { position: absolute; top: 0; left: 0; font-size: 12px; font-weight: 700; color: var(--br-gray-5); letter-spacing: 2px; text-transform: uppercase; }
  .slide.center .section-chip { left: 50%; transform: translateX(-50%); }

  h1 { font-size: var(--br-h1); font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; margin-bottom: 18px; }
  h2 { font-size: var(--br-h2); font-weight: 700; line-height: 1.15; margin-bottom: var(--br-space-4); letter-spacing: -0.5px; }
  h3 { font-size: var(--br-h3); font-weight: 600; margin-bottom: var(--br-space-2); color: var(--br-gray-1); }
  p  { font-size: var(--br-body); line-height: 1.55; color: #333; margin-bottom: var(--br-space-2); }
  p.lead { font-size: var(--br-lead); color: var(--br-text); }

  .thesis-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 24px 0; }
  .thesis-stack .word { font-size: 72px; font-weight: 800; letter-spacing: -2px; line-height: 1; }

  .agreements { display: flex; flex-direction: column; gap: 18px; max-width: 760px; margin: 10px auto 0; text-align: left; }
  .agreement { background: var(--br-card-bg); border: var(--br-border); border-radius: var(--br-radius-lg); padding: 18px 24px; }
  .agreement strong { display: block; font-size: 22px; margin-bottom: 4px; }
  .agreement span { font-size: 18px; color: var(--br-gray-3); }

  .agenda-list { display: flex; flex-direction: column; gap: 12px; max-width: 820px; margin: 6px auto 0; text-align: left; }
  .agenda-row { display: flex; align-items: baseline; gap: 18px; background: var(--br-card-bg); border: var(--br-border-thin); border-radius: var(--br-radius-lg); padding: 12px 20px; }
  .agenda-row .t { font-size: 15px; font-weight: 700; color: var(--br-gray-4); min-width: 92px; letter-spacing: 0.5px; }
  .agenda-row .b { font-size: 20px; font-weight: 600; }

  .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 10px; }
  .gcard { background: var(--br-card-bg); border: var(--br-border); border-radius: var(--br-radius-lg); padding: 22px; }
  .gcard h3 { margin-bottom: 8px; }
  .gcard p { font-size: 17px; margin-bottom: 0; color: var(--br-gray-3); }

  .big-line { font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin: 12px 0; }
  .url-pill { display: inline-block; background: var(--br-card-bg); border: var(--br-border-thin); border-radius: var(--br-radius-sm); padding: 10px 18px; font-size: 17px; font-weight: 600; margin-top: 10px; }
  a.url-pill { color: var(--br-text); text-decoration: none; }
  a.url-pill:hover { background: var(--br-text); color: #fff; }

  /* Floating glassy HUD, locked pattern 2026-06-15 */
  .hud { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 20px; align-items: center; font-size: var(--br-meta); color: var(--br-gray-3); background: rgba(255,255,255,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--br-rule); border-radius: 999px; padding: 8px 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
  .hud strong { color: var(--br-text); font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: var(--br-card-bg); color: var(--br-text); border: var(--br-border-thin); padding: 8px 18px; border-radius: var(--br-radius-sm); cursor: pointer; font-size: var(--br-meta); font-weight: 500; z-index: 1001; touch-action: manipulation; }
  button:hover { background: var(--br-text); color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: var(--br-card-bg); color: var(--br-text); }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  .br-footer { position: fixed; bottom: 8px; left: 14px; font-size: 11px; color: var(--br-gray-4); letter-spacing: 0.5px; }

  @media (max-width: 760px) {
    h1 { font-size: 42px; }
    h2 { font-size: 27px; }
    .thesis-stack .word { font-size: 42px; }
    .big-line { font-size: 30px; }
    .card-grid { grid-template-columns: 1fr; }
    .agenda-row .b { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="slide-wrap" id="slideWrap"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">← Prev</button>
      <button id="next">Next →</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">10</span></div>
  </div>
</div>
<div class="hint">← → arrow keys, swipe on mobile</div>
<div class="br-footer">Alex Salinsky · The Build Room</div>

<script>
const slides = [

  // 1 · Title
  {
    html: `<div class="slide center">
      <div class="section-chip">The Build Room · F&F Cohort</div>
      <h1 style="margin-top:30px">Become a Publisher</h1>
      <p class="lead" style="font-size:26px;color:var(--br-gray-3);font-weight:400">Session 3 · Monday cohort · July 7, 2026</p>
    </div>`
  },

  // 2 · Thesis (standing opener, slide 1 of 2)
  {
    html: `<div class="slide center">
      <div class="section-chip">Three Principles</div>
      <div class="thesis-stack" style="margin-top:30px">
        <div class="word">Learn AI.</div>
        <div class="word">Build Robots.</div>
        <div class="word">Stay Human.</div>
      </div>
    </div>`
  },

  // 3 · Agreements (standing opener, slide 2 of 2)
  {
    html: `<div class="slide center">
      <div class="section-chip">Agreements</div>
      <h2 style="margin-top:30px">Our Agreements</h2>
      <div class="agreements">
        <div class="agreement">
          <strong>Presence</strong>
          <span>Cameras on. No other work during the session. If you can't be present, don't be here.</span>
        </div>
        <div class="agreement">
          <strong>Teamwork</strong>
          <span>Pair up. Build toward each other. Champions help. What's shared here stays here.</span>
        </div>
        <div class="agreement">
          <strong>Possibility</strong>
          <span>Bring a real problem. Permission to ship janky. One small project, finished.</span>
        </div>
      </div>
    </div>`
  },

  // 4 · Today
  {
    html: `<div class="slide center">
      <div class="section-chip">Today</div>
      <h2 style="margin-top:30px">Two weeks ago you were chatting. Last week you were building. Today your build goes public.</h2>
      <div class="agenda-list">
        <div class="agenda-row"><span class="t">9:03</span><span class="b">Check-in</span></div>
        <div class="agenda-row"><span class="t">9:12</span><span class="b">Two builders show what they built</span></div>
        <div class="agenda-row"><span class="t">9:20</span><span class="b">Live: publish a build to a public URL, free</span></div>
        <div class="agenda-row"><span class="t">9:34</span><span class="b">Ledger review, your Session 3 target</span></div>
        <div class="agenda-row"><span class="t">9:46</span><span class="b">Build time, coaches come to you 1:1</span></div>
        <div class="agenda-row"><span class="t">10:52</span><span class="b">Close, Demo Day prep, send-off</span></div>
      </div>
    </div>`
  },

  // 5 · Builder shares
  {
    html: `<div class="slide center">
      <div class="section-chip">Builder Shares</div>
      <h2 style="margin-top:30px">Two builders. Four minutes each.</h2>
      <div class="big-line">Show the thing.</div>
      <p class="lead">Then one sentence: what surprised you while building it.</p>
      <p style="color:var(--br-gray-4);margin-top:8px">Not a polished demo. That's next week.</p>
    </div>`
  },

  // 6 · Publish walkthrough
  {
    html: `<div class="slide center">
      <div class="section-chip">Live Walkthrough</div>
      <h2 style="margin-top:30px">Your build gets a public URL. Today.</h2>
      <p class="lead">Watch it happen once, start to finish, on a real build. Free, no domain, no GitHub, about five minutes.</p>
      <a class="url-pill" href="https://alexsalinsky.github.io/build-room-visuals/publish-online-free-cloudflare.html" target="_blank">publish-online-free-cloudflare</a>
      <p style="color:var(--br-gray-4);margin-top:14px">The recipe stays at that link. You'll run it yourself during build time.</p>
    </div>`
  },

  // 7 · Ledger review
  {
    html: `<div class="slide center">
      <div class="section-chip">Ledger Review</div>
      <h2 style="margin-top:30px">Your Session 3 target</h2>
      <div class="card-grid">
        <div class="gcard">
          <h3>Shippable</h3>
          <p>The thing works end to end on one real case.</p>
        </div>
        <div class="gcard">
          <h3>Public where it fits</h3>
          <p>If your build is a page or an app, it gets a URL today.</p>
        </div>
        <div class="gcard">
          <h3>Hand-off ready</h3>
          <p>A README a teammate could pick up without asking you.</p>
        </div>
      </div>
      <p style="color:var(--br-gray-4);margin-top:18px">45 seconds per builder. We confirm your target, then you build.</p>
    </div>`
  },

  // 8 · Build time
  {
    html: `<div class="slide center">
      <div class="section-chip">Build Time</div>
      <h2 style="margin-top:30px">66 minutes. Head down.</h2>
      <p class="lead">Coaching is 1:1 today. A coach comes to you, we work your build, then move on.</p>
      <div class="big-line">Stuck 10 minutes? Raise your hand.</div>
      <p style="color:var(--br-gray-4)">If two people hit the same wall, we fix it live on screen for everyone.</p>
    </div>`
  },

  // 9 · Close + Demo Day
  {
    html: `<div class="slide center">
      <div class="section-chip">Demo Day</div>
      <h2 style="margin-top:30px">Demo Day is Monday, July 13</h2>
      <p class="lead">Four minutes each: Problem, Solution, What I Learned, What's Next.</p>
      <div class="agenda-list" style="max-width:720px">
        <div class="agenda-row"><span class="t">This week</span><span class="b">Publish or re-publish your latest version</span></div>
        <div class="agenda-row"><span class="t">Then</span><span class="b">Write your 4-minute demo script</span></div>
        <div class="agenda-row"><span class="t">Once</span><span class="b">Read it out loud to another human</span></div>
      </div>
    </div>`
  },

  // 10 · Send-off
  {
    html: `<div class="slide center">
      <h2>One sentence: what are you carrying into Demo Day week?</h2>
      <div class="thesis-stack" style="margin-top:20px">
        <div class="word" style="font-size:44px">Learn AI. Build Robots. Stay Human.</div>
      </div>
    </div>`
  }
];

let i = 0;
const wrap = document.getElementById("slideWrap");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = slides.length;

function render() {
  wrap.innerHTML = slides[i].html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < slides.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

let touchX = null;
document.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -50) next.click();
  if (dx > 50) prev.click();
  touchX = null;
}, { passive: true });

render();
</script>
</body>
</html>
