<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What's happening inside the robot? / &#xBF;Qu&#xE9; est&#xE1; pasando dentro del robot?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .title-screen { font-size: 52px; font-weight: 700; text-align: center; color: #1a1a1a; letter-spacing: -1px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .title-es { display: block; font-size: 38px; font-weight: 400; color: #2563eb; font-style: italic; margin-top: 10px; letter-spacing: -0.5px; }
  .caption { max-width: 920px; text-align: center; font-size: 17px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 66px; }
  .cap-en { display: block; }
  .cap-es { display: block; font-size: 14px; color: #2563eb; font-style: italic; margin-top: 4px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  /* Language toggle */
  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  /* Mode-based visibility */
  body.mode-en .cap-es { display: none; }
  body.mode-en .title-es { display: none; }
  body.mode-es .cap-en { display: none; }
  body.mode-es .title-screen > span.title-en { display: none; }

  .el { opacity: 0; transition: opacity 0.35s ease; }
  .el.show { opacity: 1; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-finale { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-wrap { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-dasharray: 8 6; }
  .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .arrow { fill: #1a1a1a; }
  .label-h { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
  .label-h-white { font-size: 22px; font-weight: 700; fill: #fff; }
  .label-b { font-size: 16px; font-weight: 400; fill: #1a1a1a; }
  .label-b-white { font-size: 16px; font-weight: 400; fill: #fff; }
  .label-edge { font-size: 14px; font-weight: 500; fill: #555; }
  .label-es { font-size: 11px; font-style: italic; fill: #2563eb; }
</style>
</head>
<body class="mode-both">

<div class="lang-toggle">
  <button onclick="setMode('en')" id="btn-en">EN</button>
  <button onclick="setMode('both')" id="btn-both" class="active">EN+ES</button>
  <button onclick="setMode('es')" id="btn-es">ES</button>
</div>

<div class="stage">
  <div class="frame-wrap" id="frame">
    <div class="title-screen" id="titleScreen">
      <span class="title-en">What's happening<br/>inside the robot?</span>
      <span class="title-es">&#xBF;Qu&#xE9; est&#xE1; pasando<br/>dentro del robot?</span>
      <span class="sub">The Build Room</span>
    </div>
    <svg id="diagram" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet" style="display:none">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
        </marker>
      </defs>

      <!-- STEP 2: CHAT -->
      <g class="el" data-step="2">
        <rect x="420" y="270" width="240" height="140" rx="10" class="box"/>
        <text x="540" y="305" text-anchor="middle" class="label-h">Chat</text>
        <rect x="450" y="325" width="180" height="65" rx="6" class="box"/>
        <text x="540" y="365" text-anchor="middle" class="label-b">prompt</text>
      </g>

      <!-- STEP 3: LLM + arrows -->
      <g class="el" data-step="3">
        <rect x="440" y="50" width="200" height="90" rx="45" class="box"/>
        <text x="540" y="105" text-anchor="middle" class="label-h">LLM</text>
        <path d="M 500 270 L 500 145" class="line" marker-end="url(#arrow)"/>
        <text x="465" y="210" text-anchor="middle" class="label-edge">prompt</text>
        <path d="M 580 145 L 580 265" class="line" marker-end="url(#arrow)"/>
        <!-- EN label -->
        <text x="624" y="204" text-anchor="middle" class="label-edge">response</text>
        <!-- ES label -->
        <text x="624" y="218" text-anchor="middle" class="label-es">respuesta</text>
      </g>

      <!-- STEP 4: CONTEXT box + Memory -->
      <g class="el" data-step="4">
        <rect x="40" y="230" width="280" height="220" rx="10" class="box"/>
        <!-- EN -->
        <text x="180" y="262" text-anchor="middle" class="label-h">Context</text>
        <!-- ES -->
        <text x="180" y="278" text-anchor="middle" class="label-es">Contexto</text>
        <!-- EN -->
        <text x="70" y="308" class="label-b">&#x2022; Memory</text>
        <!-- ES -->
        <text x="70" y="322" class="label-es">&#x2022; Memoria</text>
      </g>

      <!-- STEP 5: Context fills out -->
      <g class="el" data-step="5">
        <text x="70" y="345" class="label-b">&#x2022; MD files</text>
        <text x="70" y="358" class="label-es">&#x2022; Archivos MD</text>
        <text x="70" y="378" class="label-b">&#x2022; Chat history</text>
        <text x="70" y="391" class="label-es">&#x2022; Historial de chat</text>
        <text x="70" y="411" class="label-b">&#x2022; References</text>
        <text x="70" y="424" class="label-es">&#x2022; Referencias</text>
      </g>

      <!-- STEP 6: Context joins prompt line -->
      <g class="el" data-step="6">
        <path d="M 320 340 L 380 340 L 380 200 L 495 200" class="line" marker-end="url(#arrow)"/>
        <!-- EN -->
        <text x="395" y="185" class="label-edge">joins</text>
        <!-- ES -->
        <text x="395" y="197" class="label-es">se une</text>
      </g>

      <!-- STEP 7: INTEGRATION box -->
      <g class="el" data-step="7">
        <rect x="730" y="50" width="290" height="380" rx="10" class="box"/>
        <!-- EN -->
        <text x="875" y="80" text-anchor="middle" class="label-h">Integration</text>
        <!-- ES -->
        <text x="875" y="94" text-anchor="middle" class="label-es">Integraci&#xF3;n</text>

        <rect x="760" y="110" width="230" height="85" rx="8" class="box"/>
        <!-- EN -->
        <text x="875" y="142" text-anchor="middle" class="label-h">Key</text>
        <!-- ES -->
        <text x="875" y="156" text-anchor="middle" class="label-es">Clave</text>
        <text x="875" y="174" text-anchor="middle" class="label-b">(API token)</text>

        <path d="M 875 200 L 875 250" class="line" marker-end="url(#arrow)"/>

        <rect x="760" y="255" width="230" height="160" rx="8" class="box"/>
        <!-- EN -->
        <text x="875" y="290" text-anchor="middle" class="label-h">Platform</text>
        <!-- ES -->
        <text x="875" y="304" text-anchor="middle" class="label-es">Plataforma</text>
        <text x="875" y="325" text-anchor="middle" class="label-b">e.g. ClickUp,</text>
        <text x="875" y="350" text-anchor="middle" class="label-b">Google Drive,</text>
        <text x="875" y="375" text-anchor="middle" class="label-b">Notion, Trello</text>

        <path d="M 640 80 L 725 80" class="line" marker-end="url(#arrow)"/>
        <path d="M 725 110 L 640 110" class="line" marker-end="url(#arrow)"/>
      </g>

      <!-- STEP 8: System wrapper -->
      <g class="el" data-step="8">
        <rect x="20" y="20" width="1060" height="450" rx="14" class="box-wrap"/>
        <!-- EN -->
        <text x="40" y="42" class="label-edge">the system</text>
        <!-- ES -->
        <text x="40" y="54" class="label-es">el sistema</text>
      </g>

      <!-- STEP 9: Product -->
      <g class="el" data-step="9">
        <path d="M 550 470 L 550 530" class="line" marker-end="url(#arrow)"/>
        <rect x="200" y="540" width="700" height="170" rx="12" class="box-finale"/>
        <!-- EN -->
        <text x="550" y="576" text-anchor="middle" class="label-h-white">Product</text>
        <!-- ES -->
        <text x="550" y="591" text-anchor="middle" style="font-size:12px;font-style:italic;fill:#93c5fd;">Producto</text>
        <text x="240" y="618" class="label-b-white">&#x2022; Travel itinerary</text>
        <text x="240" y="633" style="font-size:12px;font-style:italic;fill:#93c5fd;">&#x2022; Itinerario de viaje</text>
        <text x="240" y="651" class="label-b-white">&#x2022; Application</text>
        <text x="240" y="666" style="font-size:12px;font-style:italic;fill:#93c5fd;">&#x2022; Aplicaci&#xF3;n</text>
        <text x="240" y="684" class="label-b-white">&#x2022; Virtual assistant</text>
        <text x="570" y="618" class="label-b-white">&#x2022; WhatsApp digest</text>
        <text x="570" y="633" style="font-size:12px;font-style:italic;fill:#93c5fd;">&#x2022; Digest de WhatsApp</text>
        <text x="570" y="651" class="label-b-white">&#x2022; Automation</text>
        <text x="570" y="666" style="font-size:12px;font-style:italic;fill:#93c5fd;">&#x2022; Automatizaci&#xF3;n</text>
        <text x="570" y="684" class="label-b-white">&#x2022; &#x2026;something you build</text>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">9</span></div>
  </div>
</div>
<div class="hint">&#x2190; &#x2192; arrow keys also work</div>

<script>
const captionsEN = [
  "What's happening inside the robot?",
  "Start in the middle: Chat. Where you write a prompt.",
  "The prompt goes out to the LLM. The LLM returns a response. That's what most people are doing.",
  "Context can travel with the prompt. First piece: memory. Claude and ChatGPT build memory about you.",
  "Context fills out: memory, MD files, chat history, references you've given it.",
  "Context joins the prompt on its way up. It rides along.",
  "Sometimes the LLM calls an integration. Inside an integration: a key (your API token) gives access to a platform.",
  "Zoom out. All of this together is the system.",
  "And out of that system, we build a product. Something you can use and share outside of the chat."
];

const captionsES = [
  "\xBFQu\xE9 est\xE1 pasando dentro del robot?",
  "Empecemos en el centro: el Chat. Donde escribes un prompt.",
  "El prompt va al LLM. El LLM devuelve una respuesta. Eso es lo que hace la mayor\xEDa de la gente.",
  "El Contexto puede viajar junto con el prompt. Primera pieza: la memoria. Claude y ChatGPT construyen memoria sobre ti.",
  "El Contexto se completa: memoria, archivos MD, historial de chat, referencias que le has dado.",
  "El Contexto se une al prompt en su camino. Va junto.",
  "A veces el LLM llama a una Integraci\xF3n. Dentro de una integraci\xF3n: una clave (tu token API) da acceso a una plataforma.",
  "Ampliemos la vista. Todo esto junto es el sistema.",
  "Y de ese sistema, construimos un producto. Algo que puedes usar y compartir fuera del chat."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#1a1a1a;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }

  // Show/hide ES labels inside SVG
  document.querySelectorAll('#diagram .label-es').forEach(el => {
    el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
</body>
</html>
