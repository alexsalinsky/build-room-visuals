<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Day: Wednesday, August 19 / Mi&#xE9;rcoles 19 de agosto</title>
<!--
  NEW for S3. Shown at the "frame today" moment (0:11-0:13).
  The date on screen does the pressure work, so it stays big and uncluttered.
  One supporting line only. Fixed top-right EN | EN+ES | ES toggle. Default: Both.
  Cohort: hvr2, Session 3 = Wed 2026-08-12. Demo Day = Wed 2026-08-19 (verified).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 40px; gap: 0; text-align: center; }

  .eyebrow-en { font-size: 17px; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; color: #92400e; }
  .eyebrow-es { font-size: 13px; font-style: italic; color: #b07a1e; letter-spacing: 0.1em; margin-top: 5px; }

  .date-en { font-size: 96px; font-weight: 900; letter-spacing: -3px; line-height: 1.02; margin-top: 26px; }
  .date-en .day { display: block; font-size: 46px; font-weight: 700; letter-spacing: -0.5px; color: #444; margin-bottom: 2px; }
  .date-es { font-size: 56px; font-weight: 500; font-style: italic; color: #2563eb; letter-spacing: -1.2px; line-height: 1.08; margin-top: 16px; }
  .date-es .day-es { display: block; font-size: 28px; font-weight: 400; color: #60a5fa; margin-bottom: 1px; }

  .rule { width: 240px; height: 4px; background: #C9932F; border-radius: 2px; margin: 34px 0 30px; }

  .line-en { font-size: 26px; font-weight: 700; line-height: 1.3; max-width: 780px; letter-spacing: -0.3px; }
  .line-es { font-size: 19px; font-weight: 400; font-style: italic; color: #2563eb; line-height: 1.35; max-width: 780px; margin-top: 8px; }

  .byline { position: fixed; bottom: 10px; left: 16px; font-size: 11px; color: #bbb; }

  /* Language toggle */
  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  /* Mode visibility */
  body.mode-en .eyebrow-es,
  body.mode-en .date-es,
  body.mode-en .line-es { display: none; }

  body.mode-es .eyebrow-en,
  body.mode-es .date-en,
  body.mode-es .line-en { display: none; }
  body.mode-es .date-es { font-size: 82px; font-weight: 800; font-style: normal; color: #1a1a1a; letter-spacing: -2.5px; }
  body.mode-es .date-es .day-es { font-size: 40px; font-weight: 700; color: #444; }
  body.mode-es .line-es { font-size: 25px; font-weight: 700; font-style: normal; color: #1a1a1a; }

  @media (max-width: 760px) {
    .date-en { font-size: 58px; letter-spacing: -1.5px; }
    .date-en .day { font-size: 30px; }
    .date-es { font-size: 34px; }
    .line-en { font-size: 20px; }
  }
</style>
</head>
<body class="mode-both">

<div class="lang-toggle">
  <button onclick="setMode('en')" id="btn-en">EN</button>
  <button onclick="setMode('both')" id="btn-both" class="active">EN+ES</button>
  <button onclick="setMode('es')" id="btn-es">ES</button>
</div>

<div class="stage">

  <div class="eyebrow-en">Demo Day</div>
  <div class="eyebrow-es">El d&#xED;a que presentas</div>

  <div class="date-en">
    <span class="day">Wednesday</span>
    August 19
  </div>

  <div class="date-es">
    <span class="day-es">Mi&#xE9;rcoles</span>
    19 de agosto
  </div>

  <div class="rule"></div>

  <div class="line-en">This is the only session between now and Demo Day.</div>
  <div class="line-es">Esta es la &#xFA;nica sesi&#xF3;n entre hoy y el Demo Day.</div>

</div>

<div class="byline">Alex Salinsky / Humans V Robots</div>

<script>
function setMode(m) {
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
}
</script>
</body>
</html>
