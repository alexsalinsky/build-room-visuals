    <br/><br/>Quieres un <strong>informe del lunes por la ma\xF1ana</strong> que jale de tres fuentes (pitches por email, calendario, tablero de Monday) y produzca una vista \xFAnica y priorizada de en qu\xE9 concentrarse hoy. El objetivo es eliminar ~2 horas semanales de trabajo de ensamble. El usuario eres t\xFA. \xBFEs correcto? \xBFAlgo que me falt\xF3?</div>

  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>

let i = 0;
const frame = document.getElementById("frame");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captions.length;

function render() {
  cap.textContent = captions[i];
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captions.length - 1;
  frame.innerHTML = stepHTML[i];
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captions.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
