<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Planea el problema — The Build Room</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .title-screen { font-size: 60px; font-weight: 700; text-align: center; color: #1a1a1a; letter-spacing: -1px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .caption { max-width: 920px; text-align: center; font-size: 18px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 56px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  .el { opacity: 0; transition: opacity 0.35s ease; }
  .el.show { opacity: 1; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-finale { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2.5; }
  .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .line-thin { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
  .arrow { fill: #1a1a1a; }
  .head-xl { font-size: 26px; font-weight: 700; fill: #1a1a1a; letter-spacing: 1px; }
  .head-q { font-size: 14px; font-style: italic; fill: #666; }
  .label-h-white { font-size: 22px; font-weight: 700; fill: #fff; }
  .label-b { font-size: 16px; font-weight: 400; fill: #1a1a1a; }
  .label-b-bold { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
  .label-b-white { font-size: 16px; font-weight: 400; fill: #fff; }
  .label-sm { font-size: 13px; font-weight: 400; fill: #666; }
  .badge { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
  .badge-text { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame-wrap" id="frame">
    <div class="title-screen" id="titleScreen">
      Planea el problema
      <span class="sub">Piensa como dise&#xF1;ador · The Build Room</span>
    </div>
    <svg id="diagram" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet" style="display:none">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
        </marker>
      </defs>

      <!-- ===== Header area: always visible from step 2+ ===== -->
      <g class="el" data-step="2">
        <text x="550" y="40" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#1a1a1a">Planea el problema</text>
        <text x="550" y="68" text-anchor="middle" class="label-sm">&#xBFQu&#xE9; resultado quiero, qu&#xE9; entrada me lleva ah&#xED;, y cu&#xE1;ndo sucede?</text>
      </g>

      <!-- ===== STEP 2: Three empty columns + headers + questions ===== -->
      <g class="el" data-step="2">
        <!-- RESULTADO column -->
        <rect x="40" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="200" y="142" text-anchor="middle" class="head-xl">RESULTADO</text>
        <text x="200" y="170" text-anchor="middle" class="head-q">&#xBFqu&#xE9; quiero?</text>
        <line x1="60" y1="190" x2="340" y2="190" class="line-thin"/>

        <!-- ENTRADA column -->
        <rect x="390" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="550" y="142" text-anchor="middle" class="head-xl">ENTRADA</text>
        <text x="550" y="170" text-anchor="middle" class="head-q">&#xBFqu&#xE9; lo alimenta?</text>
        <line x1="410" y1="190" x2="690" y2="190" class="line-thin"/>

        <!-- CUANDO column -->
        <rect x="740" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="900" y="142" text-anchor="middle" class="head-xl">CU&#xC1;NDO</text>
        <text x="900" y="170" text-anchor="middle" class="head-q">&#xBFcu&#xE1;ndo ocurre?</text>
        <line x1="760" y1="190" x2="1080" y2="190" class="line-thin"/>
      </g>

      <!-- ===== STEP 3: Project banner ===== -->
      <g class="el" data-step="3">
        <rect x="390" y="20" width="320" height="50" rx="25" class="badge"/>
        <text x="550" y="52" text-anchor="middle" class="badge-text">Ejemplo: Itinerario de viaje</text>
      </g>

      <!-- ===== STEP 4: RESULTADO filled ===== -->
      <g class="el" data-step="4">
        <text x="60" y="235" class="label-b-bold">Itinerario de viaje</text>
        <text x="60" y="270" class="label-b">en un Google Doc</text>
        <text x="60" y="295" class="label-b">o sitio web</text>
      </g>

      <!-- ===== STEP 5: ENTRADA filled ===== -->
      <g class="el" data-step="5">
        <text x="410" y="235" class="label-b-bold">• Reservas de vuelo</text>
        <text x="430" y="260" class="label-sm">del email o calendario</text>

        <text x="410" y="305" class="label-b-bold">• Eventos de calendario</text>
        <text x="430" y="330" class="label-sm">importados al llegar</text>

        <text x="410" y="375" class="label-b-bold">• Preferencias de viaje</text>
        <text x="430" y="400" class="label-sm">d&#xF3;nde me gusta hospedarme,</text>
        <text x="430" y="420" class="label-sm">qu&#xE9; me gusta ver</text>
      </g>

      <!-- ===== STEP 6: CUANDO filled ===== -->
      <g class="el" data-step="6">
        <text x="760" y="235" class="label-b-bold">• A pedido</text>
        <text x="780" y="260" class="label-sm">cuando yo lo pido</text>

        <text x="760" y="305" class="label-b-bold">• Al recibir confirmaci&#xF3;n</text>
        <text x="780" y="330" class="label-sm">llega un email de vuelo</text>
        <text x="780" y="350" class="label-sm">u hotel al correo</text>

        <text x="760" y="395" class="label-b-bold">• Al agregar evento</text>
        <text x="780" y="420" class="label-sm">evento de viaje al calendario</text>
      </g>

      <!-- ===== STEP 7: Arrow down + payoff box ===== -->
      <g class="el" data-step="7">
        <path d="M 550 540 L 550 600" class="line" marker-end="url(#arrow)"/>
        <rect x="200" y="610" width="700" height="90" rx="12" class="box-finale"/>
        <text x="550" y="645" text-anchor="middle" class="label-h-white">Tu plan de prompts</text>
        <text x="550" y="678" text-anchor="middle" class="label-b-white">Ya sabes qu&#xE9; pedirle a la IA, qu&#xE9; darle y cu&#xE1;ndo activarla.</text>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">7</span></div>
  </div>
</div>
<div class="hint">Las teclas &#x2190; &#x2192; tambi&#xE9;n funcionan</div>

<script>
const captions = [
  "Piensa como dise\xF1ador. Antes de construir, planea el problema.",
  "Tres preguntas. \xBFCu\xE1l es el RESULTADO que quiero? \xBFCu\xE1l es la ENTRADA que me lleva ah\xED? \xBFY CU\xC1NDO ocurre?",
  "Usemos uno real. Queremos construir un itinerario de viaje.",
  "RESULTADO: un itinerario de viaje. Quiz\xE1s en un Google Doc. Quiz\xE1s en un sitio sencillo. Elige la forma primero.",
  "ENTRADA: \xBFqu\xE9 lo alimenta? Reservas de vuelo (del email o calendario). Eventos de calendario. Preferencias de viaje (d\xF3nde me gusta hospedarme, qu\xE9 me gusta ver).",
  "CU\xC1NDO: a pedido cuando yo lo pido. O autom\xE1ticamente, cuando llega una nueva confirmaci\xF3n al correo o se agrega un evento de viaje al calendario.",
  "Ya tienes un plan de prompts. Sabes exactamente qu\xE9 pedirle a la IA, qu\xE9 darle y cu\xE1ndo activarla. Ese es el paso de dise\xF1o."
];

let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captions.length;

function render() {
  cap.textContent = captions[i];
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captions.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captions.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
</body>
</html>
