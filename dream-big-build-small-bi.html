<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dream Big, Build Small / Suena en grande, construye en chico</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .title-screen { font-size: 50px; font-weight: 700; text-align: center; color: #1a1a1a; letter-spacing: -1px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .title-es { display: block; font-size: 34px; font-weight: 400; color: #2563eb; font-style: italic; margin-top: 10px; letter-spacing: -0.5px; }
  .caption { max-width: 920px; text-align: center; font-size: 17px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 66px; }
  .cap-en { display: block; }
  .cap-es { display: block; font-size: 14px; color: #2563eb; font-style: italic; margin-top: 4px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  body.mode-en .cap-es { display: none; }
  body.mode-en .title-es { display: none; }
  body.mode-es .cap-en { display: none; }
  body.mode-es .title-screen > span.title-en { display: none; }

  .el { opacity: 0; transition: opacity 0.35s ease; }
  .el.show { opacity: 1; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-finale { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2.5; }
  .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .arrow { fill: #1a1a1a; }
  .head-xl { font-size: 30px; font-weight: 700; fill: #1a1a1a; letter-spacing: 1px; }
  .head-l { font-size: 24px; font-weight: 700; fill: #1a1a1a; }
  .head-l-white { font-size: 22px; font-weight: 700; fill: #fff; }
  .label-b { font-size: 15px; font-weight: 400; fill: #1a1a1a; }
  .label-b-white { font-size: 15px; font-weight: 400; fill: #fff; }
  .label-edge { font-size: 14px; font-weight: 500; fill: #555; font-style: italic; }
  .label-sm { font-size: 13px; font-weight: 400; fill: #666; }
  .label-es { font-size: 11px; font-style: italic; fill: #2563eb; }
  .label-es-white { font-size: 11px; font-style: italic; fill: #93c5fd; }
  .badge { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
  .badge-text { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
</style>
</head>
<body class="mode-both">

<div class="lang-toggle">
  <button onclick="setMode('en')" id="btn-en">EN</button>
  <button onclick="setMode('both')" id="btn-both" class="active">EN+ES</button>
  <button onclick="setMode('es')" id="btn-es">ES</button>
</div>

<div class="stage">
  <div class="frame-wrap" id="frame">
    <div class="title-screen" id="titleScreen">
      <span class="title-en">Dream Big,<br/>Build Small</span>
      <span class="title-es">Suena en grande,<br/>construye en chico</span>
      <span class="sub">Backwards Design &middot; The Build Room</span>
    </div>
    <svg id="diagram" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet" style="display:none">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
        </marker>
      </defs>

      <!-- STEP 2: DREAM box -->
      <g class="el" data-step="2">
        <rect x="150" y="30" width="800" height="185" rx="14" class="box"/>
        <text x="550" y="72" text-anchor="middle" class="head-xl">DREAM</text>
        <text x="550" y="92" text-anchor="middle" class="label-es">SUENO</text>
        <text x="550" y="112" text-anchor="middle" class="label-edge">what do you really want?</text>
        <text x="550" y="126" text-anchor="middle" class="label-es">&#xBFQu&#xE9; es lo que realmente quieres?</text>
      </g>

      <!-- STEP 3: Dream examples inside -->
      <g class="el" data-step="3">
        <text x="200" y="152" class="label-b">&#x2022; An AI assistant that runs my whole inbox</text>
        <text x="200" y="164" class="label-es">&#x2022; Un asistente de IA que gestione toda mi bandeja de entrada</text>
        <text x="200" y="178" class="label-b">&#x2022; A product that automatically writes great guest posts in our brand voice</text>
        <text x="200" y="190" class="label-es">&#x2022; Un producto que redacte posts en nuestra voz de marca autom&#xE1;ticamente</text>
        <text x="200" y="204" class="label-b">&#x2022; A virtual COO that flags deadlines in WhatsApp</text>
        <text x="200" y="216" class="label-es">&#x2022; Un COO virtual que mande alertas de plazos por WhatsApp</text>
      </g>

      <!-- STEP 4: Arrow down + label -->
      <g class="el" data-step="4">
        <path d="M 550 220 L 550 280" class="line" marker-end="url(#arrow)"/>
        <text x="590" y="252" class="label-edge">we work backwards</text>
        <text x="590" y="265" class="label-es">trabajamos al rev&#xE9;s</text>
      </g>

      <!-- STEP 5: MVP box -->
      <g class="el" data-step="5">
        <rect x="270" y="285" width="560" height="150" rx="12" class="box"/>
        <text x="550" y="320" text-anchor="middle" class="head-l">MVP</text>
        <text x="550" y="340" text-anchor="middle" class="label-edge">smallest version that proves it can work</text>
        <text x="550" y="354" text-anchor="middle" class="label-es">la versi&#xF3;n m&#xED;nima que demuestra que funciona</text>
        <text x="300" y="376" class="label-b">e.g. one email category, one client, one brand voice, one user.</text>
        <text x="300" y="390" class="label-es">ej. una categor&#xED;a de email, un cliente, una voz, un usuario.</text>
      </g>

      <!-- STEP 6: Arrow + FIRST BRICK box -->
      <g class="el" data-step="6">
        <path d="M 550 445 L 550 490" class="line" marker-end="url(#arrow)"/>
        <rect x="330" y="495" width="440" height="150" rx="12" class="box-finale"/>
        <text x="550" y="528" text-anchor="middle" class="head-l-white">FIRST BRICK</text>
        <text x="550" y="543" text-anchor="middle" style="font-size:11px;font-style:italic;fill:#93c5fd;">PRIMER LADRILLO</text>
        <text x="550" y="561" text-anchor="middle" class="label-b-white" style="font-style:italic;fill:#bbb">smallest component you can build TODAY</text>
        <text x="550" y="575" text-anchor="middle" class="label-es-white">el componente m&#xE1;s peque&#xF1;o que puedes construir HOY</text>
        <text x="550" y="597" text-anchor="middle" class="label-b-white">One end-to-end slice. One connection. One output.</text>
        <text x="550" y="612" text-anchor="middle" class="label-es-white">Un corte de punta a punta. Una conexi&#xF3;n. Un resultado.</text>
        <text x="550" y="630" text-anchor="middle" class="label-es-white">Un corte de punta a punta. Una conexi&#xF3;n. Un resultado.</text>
      </g>

      <!-- STEP 7: 4-hour badge -->
      <g class="el" data-step="7">
        <rect x="770" y="520" width="200" height="56" rx="28" class="badge"/>
        <text x="870" y="547" text-anchor="middle" class="badge-text">~4 hours of building</text>
        <text x="870" y="562" text-anchor="middle" style="font-size:11px;font-style:italic;fill:#92400e;">~4 horas de construcci&#xF3;n</text>
        <path d="M 765 550 L 750 550" class="line"/>
      </g>

      <!-- STEP 8: Closing tagline -->
      <g class="el" data-step="8">
        <text x="550" y="668" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1a1a1a">Same approach when prompting AI. Planning is half the work.</text>
        <text x="550" y="683" text-anchor="middle" style="font-size:12px;font-style:italic;fill:#2563eb;">Lo mismo al hacer prompts. Planear es la mitad del trabajo.</text>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">8</span></div>
  </div>
</div>
<div class="hint">&#x2190; &#x2192; arrow keys also work</div>

<script>
const captionsEN = [
  "Dream big, build small. This is how we approach every project.",
  "Start with the dream. What do you really want? Don't filter yet.",
  "A few real dreams. Big, ambitious, useful. The dream is where the energy is.",
  "Then we work backwards. We don't try to build the whole dream today. We design backwards from it.",
  "First stop: the MVP. The smallest version that proves the idea can work. One user. One slice. Real output.",
  "Then the FIRST BRICK. The smallest component you can build TODAY. One connection. One output. End to end.",
  "Roughly 4 hours of building. That's our scope. Anything bigger gets cut. Anything smaller doesn't prove anything.",
  "Same approach when you prompt AI. Tell it your dream. Then plan the smallest piece. Then build the fastest prototype. Planning is half the work."
];

const captionsES = [
  "Suena en grande, construye en chico. As\xED abordamos cada proyecto.",
  "Empieza con el sue\xF1o. \xBFQu\xE9 es lo que realmente quieres? No te limites todav\xEDa.",
  "Unos sue\xF1os reales. Grandes, ambiciosos, \xFAtiles. El sue\xF1o es donde est\xE1 la energ\xEDa.",
  "Luego trabajamos al rev\xE9s. No intentamos construir todo el sue\xF1o hoy. Dise\xF1amos desde \xE9l hacia atr\xE1s.",
  "Primera parada: el MVP. La versi\xF3n m\xEDs peque\xF1a que demuestra que la idea puede funcionar. Un usuario. Un corte. Resultado real.",
  "Luego el PRIMER LADRILLO. El componente m\xE1s peque\xF1o que puedes construir HOY. Una conexi\xF3n. Un resultado. De punta a punta.",
  "Aproximadamente 4 horas de construcci\xF3n. Ese es nuestro alcance. Cualquier cosa mayor se recorta. Cualquier cosa menor no demuestra nada.",
  "Lo mismo cuando haces prompts. Cu\xE9ntale tu sue\xF1o. Luego planea la pieza m\xE1s peque\xF1a. Luego construye el prototipo m\xE1s r\xE1pido. Planear es la mitad del trabajo."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#1a1a1a;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }

  document.querySelectorAll('#diagram .label-es, #diagram .label-es-white').forEach(el => {
    el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
</body>
</html>
