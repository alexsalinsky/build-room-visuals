<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>C&#xF3;mo hacer prompts: Planea primero, construye despu&#xE9;s</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; max-width: 920px; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .title-screen { font-size: 56px; font-weight: 800; text-align: center; color: #1a1a1a; letter-spacing: -1.5px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .caption { max-width: 920px; text-align: center; font-size: 18px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 56px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  /* Chat window */
  .chat { width: 100%; max-width: 820px; max-height: 100%; background: #fff; border: 2.5px solid #1a1a1a; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .chat-header { font-size: 12px; color: #888; letter-spacing: 2px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .chat-header span:last-child { color: #16a34a; }

  .bubble { max-width: 88%; padding: 14px 18px; border-radius: 14px; font-size: 16px; line-height: 1.55; opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(8px); }
  .bubble.show { opacity: 1; transform: translateY(0); }
  .bubble.user { background: #1a1a1a; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble.ai { background: #f4ede0; color: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble .role { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.7; margin-bottom: 4px; }
  .bubble.ai .role { color: #92400e; }
  .bubble strong { font-weight: 700; }

  .highlight { background: #fde68a; padding: 1px 4px; border-radius: 3px; color: #1a1a1a; }

  .title-screen-wrap { width: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame-wrap" id="frame"></div>
  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">9</span></div>
  </div>
</div>
<div class="hint">Las teclas &#x2190; &#x2192; tambi&#xE9;n funcionan</div>

<script>
const captions = [
  "C\xF3mo hacer prompts. El truco que la mayor\xEDa de la gente se salta.",
  "La mayor\xEDa abre el chat y empieza a darle \xF3rdenes a la IA. Luego se sorprende cuando construye lo equivocado.",
  "Mejor movimiento: modo planificaci\xF3n. Habla sobre lo que quieres antes de pedirle a la IA que haga algo.",
  "Movimiento 1: Di lo que esperas. No te filtres. Habla como si se lo explicaras a un amigo.",
  "Movimiento 2: P\xEDdele a la IA que repita lo que entendi\xF3. Esta es la l\xEDnea m\xE1gica.",
  "Te dice lo que cree que est\xE1s preguntando. Ahora ves la brecha.",
  "Corriges. O amplias. O afinas.",
  "Sigue hasta que el entendimiento de la IA coincida con el tuyo. Solo entonces, cambia a construir.",
  "Planear es la mitad del trabajo. Saltarlo significa rehacer lo mismo tres veces."
];

const stepHTML = [
  // Step 1: Title screen
  `<div class="title-screen-wrap"><div class="title-screen">C&#xF3;mo hacer prompts<span class="sub">Planea primero, construye despu&#xE9;s &middot; The Build Room</span></div></div>`,

  // Step 2: The mistake (chat showing premature action)
  `<div class="chat">
    <div class="chat-header"><span>As\xED empieza la mayor\xEDa de la gente</span><span>&#x25CF; En vivo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Hazme una herramienta que organice mi tablero de Monday y mande recordatorios a mi equipo.</div>
  </div>`,

  // Step 3: The fix - planning mode (blank chat, ready)
  `<div class="chat">
    <div class="chat-header"><span>Mejor: modo planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div style="padding:40px;text-align:center;color:#999;font-style:italic">habla primero. construye despu\xE9s.</div>
  </div>`,

  // Step 4: Say what you're hoping for
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
  </div>`,

  // Step 5: The magic line
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
    <div class="bubble user show" data-id="2"><div class="role">T\xDA</div>Antes de empezar a construir, <span class="highlight">d\xEDme qu\xE9 entiendes que te estoy pidiendo</span>. Todav\xEDa estamos en planificaci\xF3n.</div>
  </div>`,

  // Step 6: AI echoes back
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
    <div class="bubble user show" data-id="2"><div class="role">T\xDA</div>Antes de empezar a construir, <span class="highlight">d\xEDme qu\xE9 entiendes que te estoy pidiendo</span>. Todav\xEDa estamos en planificaci\xF3n.</div>
    <div class="bubble ai show" data-id="3"><div class="role">IA</div>Esto es lo que entiendo:
    <br/><br/>Quieres un <strong>informe del lunes por la ma\xF1ana</strong> que jale de tres fuentes (pitches por email, calendario, tablero de Monday) y produzca una vista \xFAnica y priorizada de en qu\xE9 concentrarse hoy. El objetivo es eliminar ~2 horas semanales de trabajo de ensamble. El usuario eres t\xFA. \xBFEs correcto? \xBFAlgo que me falt\xF3?</div>
  </div>`,

  // Step 7: User corrects/expands
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Listo</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
    <div class="bubble user show" data-id="2"><div class="role">T\xDA</div>Antes de empezar a construir, <span class="highlight">d\xEDme qu\xE9 entiendes que te estoy pidiendo</span>. Todav\xEDa estamos en planificaci\xF3n.</div>
    <div class="bubble ai show" data-id="3"><div class="role">IA</div>Esto es lo que entiendo:
    <br/><br/>Quieres un <strong>informe del lunes por la ma\xF1ana</strong> que jale de tres fuentes (pitches por email, calendario, tablero de Monday) y produzca una vista \xFAnica y priorizada de en qu\xE9 concentrarse hoy. El objetivo es eliminar ~2 horas semanales de trabajo de ensamble. El usuario eres t\xFA. \xBFEs correcto? \xBFAlgo que me falt\xF3?</div>
    <div class="bubble user show" data-id="4"><div class="role">T\xDA</div>Casi. Dos cosas m\xE1s. <strong>Una</strong>: debe marcar pitches que no han tenido respuesta en 48+ horas. <strong>Dos</strong>: el resultado debe llegar a WhatsApp a las 8am, no a un email que voy a ignorar.</div>
  </div>`,

  // Step 8: Aligned, switch to building
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Alineados</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
    <div class="bubble user show" data-id="2"><div class="role">T\xDA</div>Antes de empezar a construir, <span class="highlight">d\xEDme qu\xE9 entiendes que te estoy pidiendo</span>. Todav\xEDa estamos en planificaci\xF3n.</div>
    <div class="bubble ai show" data-id="3"><div class="role">IA</div>Esto es lo que entiendo:
    <br/><br/>Quieres un <strong>informe del lunes por la ma\xF1ana</strong> que jale de tres fuentes (pitches por email, calendario, tablero de Monday) y produzca una vista \xFAnica y priorizada de en qu\xE9 concentrarse hoy. El objetivo es eliminar ~2 horas semanales de trabajo de ensamble. El usuario eres t\xFA. \xBFEs correcto? \xBFAlgo que me falt\xF3?</div>
    <div class="bubble user show" data-id="4"><div class="role">T\xDA</div>Casi. Dos cosas m\xE1s. <strong>Una</strong>: debe marcar pitches que no han tenido respuesta en 48+ horas. <strong>Dos</strong>: el resultado debe llegar a WhatsApp a las 8am, no a un email que voy a ignorar.</div>
    <div class="bubble user show" data-id="5"><div class="role">T\xDA</div>Bien. <span class="highlight">Ahora construyamos la versi\xF3n m\xE1s peque\xF1a.</span> \xBFCu\xE1l es la primera pieza?</div>
  </div>`,

  // Step 9: Final state with payoff (same chat)
  `<div class="chat">
    <div class="chat-header"><span>Conversaci\xF3n de planificaci\xF3n</span><span>&#x25CF; Alineados &middot; Modo construcci\xF3n</span></div>
    <div class="bubble user show" data-id="1"><div class="role">T\xDA</div>Ok, lo que espero es algo que quite el caos de mi semana. Estoy en PR orientado a clientes. Cada lunes pierdo dos horas solo para saber qu\xE9 tengo que hacer. Hay pitches en mi email, eventos de calendario, un tablero de Monday, y tengo que unirlo todo mentalmente. Quiero un solo lugar que me diga qu\xE9 importa hoy.</div>
    <div class="bubble user show" data-id="2"><div class="role">T\xDA</div>Antes de empezar a construir, <span class="highlight">d\xEDme qu\xE9 entiendes que te estoy pidiendo</span>. Todav\xEDa estamos en planificaci\xF3n.</div>
    <div class="bubble ai show" data-id="3"><div class="role">IA</div>Esto es lo que entiendo:
    <br/><br/>Quieres un <strong>informe del lunes por la ma\xF1ana</strong> que jale de tres fuentes (pitches por email, calendario, tablero de Monday) y produzca una vista \xFAnica y priorizada de en qu\xE9 concentrarse hoy. El objetivo es eliminar ~2 horas semanales de trabajo de ensamble. El usuario eres t\xFA. \xBFEs correcto? \xBFAlgo que me falt\xF3?</div>
    <div class="bubble user show" data-id="4"><div class="role">T\xDA</div>Casi. Dos cosas m\xE1s. <strong>Una</strong>: debe marcar pitches que no han tenido respuesta en 48+ horas. <strong>Dos</strong>: el resultado debe llegar a WhatsApp a las 8am, no a un email que voy a ignorar.</div>
    <div class="bubble user show" data-id="5"><div class="role">T\xDA</div>Bien. <span class="highlight">Ahora construyamos la versi\xF3n m\xE1s peque\xF1a.</span> \xBFCu\xE1l es la primera pieza?</div>
  </div>`
];

let i = 0;
const frame = document.getElementById("frame");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captions.length;

function render() {
  cap.textContent = captions[i];
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captions.length - 1;
  frame.innerHTML = stepHTML[i];
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captions.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
</body>
</html>
