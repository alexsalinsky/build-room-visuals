<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plan the Problem / Planea el problema</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fafafa; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .frame-wrap { flex: 1; max-height: 80vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .title-screen { font-size: 52px; font-weight: 700; text-align: center; color: #1a1a1a; letter-spacing: -1px; line-height: 1.1; }
  .title-screen .sub { display: block; font-size: 22px; font-weight: 400; margin-top: 18px; color: #666; letter-spacing: 0; }
  .title-es { display: block; font-size: 36px; font-weight: 400; color: #2563eb; font-style: italic; margin-top: 10px; }
  .caption { max-width: 920px; text-align: center; font-size: 17px; line-height: 1.5; color: #333; padding: 0 12px; min-height: 66px; }
  .cap-en { display: block; }
  .cap-es { display: block; font-size: 14px; color: #2563eb; font-style: italic; margin-top: 4px; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 14px; color: #666; }
  .hud strong { color: #1a1a1a; font-size: 16px; }
  .controls { display: flex; gap: 10px; }
  button { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:hover { background: #1a1a1a; color: #fff; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: #fff; color: #1a1a1a; }
  .hint { position: fixed; bottom: 10px; right: 14px; opacity: 0.5; font-size: 12px; }

  .lang-toggle { position: fixed; top: 12px; right: 14px; display: flex; gap: 4px; background: #fff; border: 1.5px solid #1a1a1a; border-radius: 20px; padding: 3px 6px; font-size: 12px; font-weight: 600; z-index: 100; }
  .lang-toggle button { border: none; background: transparent; padding: 3px 8px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; }
  .lang-toggle button.active { background: #1a1a1a; color: #fff; }

  body.mode-en .cap-es { display: none; }
  body.mode-en .title-es { display: none; }
  body.mode-es .cap-en { display: none; }
  body.mode-es .title-screen > span.title-en { display: none; }

  .el { opacity: 0; transition: opacity 0.35s ease; }
  .el.show { opacity: 1; }

  .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2.5; }
  .box-finale { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2.5; }
  .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .line-thin { fill: none; stroke: #1a1a1a; stroke-width: 1.5; }
  .arrow { fill: #1a1a1a; }
  .head-xl { font-size: 22px; font-weight: 700; fill: #1a1a1a; letter-spacing: 1px; }
  .head-q { font-size: 12px; font-style: italic; fill: #666; }
  .head-q-es { font-size: 10px; font-style: italic; fill: #2563eb; }
  .label-h-white { font-size: 20px; font-weight: 700; fill: #fff; }
  .label-b { font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .label-b-bold { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .label-b-white { font-size: 14px; font-weight: 400; fill: #fff; }
  .label-sm { font-size: 12px; font-weight: 400; fill: #666; }
  .label-es { font-size: 10px; font-style: italic; fill: #2563eb; }
  .label-es-white { font-size: 10px; font-style: italic; fill: #93c5fd; }
  .badge { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
  .badge-text { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
</style>
</head>
<body class="mode-both">

<div class="lang-toggle">
  <button onclick="setMode('en')" id="btn-en">EN</button>
  <button onclick="setMode('both')" id="btn-both" class="active">EN+ES</button>
  <button onclick="setMode('es')" id="btn-es">ES</button>
</div>

<div class="stage">
  <div class="frame-wrap" id="frame">
    <div class="title-screen" id="titleScreen">
      <span class="title-en">Plan the Problem</span>
      <span class="title-es">Planea el problema</span>
      <span class="sub">Think Like a Designer &middot; The Build Room</span>
    </div>
    <svg id="diagram" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet" style="display:none">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
        </marker>
      </defs>

      <!-- Header always visible from step 2 -->
      <g class="el" data-step="2">
        <text x="550" y="36" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#1a1a1a">Plan the Problem</text>
        <text x="550" y="50" text-anchor="middle" class="label-es" style="font-size:13px;">Planea el problema</text>
        <text x="550" y="66" text-anchor="middle" class="label-sm">What output do I want, what input gets me there, and when does it happen?</text>
        <text x="550" y="78" text-anchor="middle" class="label-es">&#xBFQu&#xE9; resultado quiero, qu&#xE9; entrada me lleva ah&#xED;, y cu&#xE1;ndo sucede?</text>
      </g>

      <!-- STEP 2: Three columns -->
      <g class="el" data-step="2">
        <!-- OUTPUT column -->
        <rect x="40" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="200" y="132" text-anchor="middle" class="head-xl">OUTPUT</text>
        <text x="200" y="144" text-anchor="middle" class="label-es" style="font-size:12px;">RESULTADO</text>
        <text x="200" y="158" text-anchor="middle" class="head-q">what do I want?</text>
        <text x="200" y="170" text-anchor="middle" class="head-q-es">&#xBFqu&#xE9; quiero?</text>
        <line x1="60" y1="185" x2="340" y2="185" class="line-thin"/>

        <!-- INPUT column -->
        <rect x="390" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="550" y="132" text-anchor="middle" class="head-xl">INPUT</text>
        <text x="550" y="144" text-anchor="middle" class="label-es" style="font-size:12px;">ENTRADA</text>
        <text x="550" y="158" text-anchor="middle" class="head-q">what feeds it?</text>
        <text x="550" y="170" text-anchor="middle" class="head-q-es">&#xBFqu&#xE9; lo alimenta?</text>
        <line x1="410" y1="185" x2="690" y2="185" class="line-thin"/>

        <!-- WHEN column -->
        <rect x="740" y="100" width="320" height="420" rx="12" class="box"/>
        <text x="900" y="132" text-anchor="middle" class="head-xl">WHEN</text>
        <text x="900" y="144" text-anchor="middle" class="label-es" style="font-size:12px;">CU&#xC1;NDO</text>
        <text x="900" y="158" text-anchor="middle" class="head-q">when does it happen?</text>
        <text x="900" y="170" text-anchor="middle" class="head-q-es">&#xBFcu&#xE1;ndo ocurre?</text>
        <line x1="760" y1="185" x2="1080" y2="185" class="line-thin"/>
      </g>

      <!-- STEP 3: Project banner -->
      <g class="el" data-step="3">
        <rect x="360" y="20" width="380" height="50" rx="25" class="badge"/>
        <text x="550" y="42" text-anchor="middle" class="badge-text">Example: Travel itinerary</text>
        <text x="550" y="57" text-anchor="middle" style="font-size:11px;font-style:italic;fill:#92400e;">Ejemplo: Itinerario de viaje</text>
      </g>

      <!-- STEP 4: OUTPUT filled -->
      <g class="el" data-step="4">
        <text x="60" y="218" class="label-b-bold">Travel itinerary</text>
        <text x="60" y="230" class="label-es">Itinerario de viaje</text>
        <text x="60" y="250" class="label-b">in a Google Doc</text>
        <text x="60" y="262" class="label-es">en un Google Doc</text>
        <text x="60" y="280" class="label-b">or website</text>
        <text x="60" y="292" class="label-es">o sitio web</text>
      </g>

      <!-- STEP 5: INPUT filled -->
      <g class="el" data-step="5">
        <text x="410" y="218" class="label-b-bold">&#x2022; Airline reservations</text>
        <text x="410" y="230" class="label-es">&#x2022; Reservas de vuelo</text>
        <text x="430" y="246" class="label-sm">from email or calendar</text>
        <text x="430" y="257" class="label-es">del email o calendario</text>

        <text x="410" y="280" class="label-b-bold">&#x2022; Calendar events</text>
        <text x="410" y="292" class="label-es">&#x2022; Eventos de calendario</text>
        <text x="430" y="308" class="label-sm">imported as they land</text>
        <text x="430" y="319" class="label-es">importados al llegar</text>

        <text x="410" y="346" class="label-b-bold">&#x2022; Travel preferences</text>
        <text x="410" y="358" class="label-es">&#x2022; Preferencias de viaje</text>
        <text x="430" y="374" class="label-sm">where I like to stay,</text>
        <text x="430" y="385" class="label-es">d&#xF3;nde me gusta hospedarme,</text>
        <text x="430" y="398" class="label-sm">things I like to see</text>
        <text x="430" y="409" class="label-es">qu&#xE9; me gusta ver</text>
      </g>

      <!-- STEP 6: WHEN filled -->
      <g class="el" data-step="6">
        <text x="760" y="218" class="label-b-bold">&#x2022; On demand</text>
        <text x="760" y="230" class="label-es">&#x2022; A pedido</text>
        <text x="780" y="246" class="label-sm">I tell it to</text>
        <text x="780" y="257" class="label-es">cuando yo lo pido</text>

        <text x="760" y="280" class="label-b-bold">&#x2022; On new confirmation</text>
        <text x="760" y="292" class="label-es">&#x2022; Al recibir confirmaci&#xF3;n</text>
        <text x="780" y="308" class="label-sm">airline or hotel email</text>
        <text x="780" y="319" class="label-es">llega un email de vuelo u hotel</text>
        <text x="780" y="332" class="label-sm">lands in inbox</text>
        <text x="780" y="343" class="label-es">al correo</text>

        <text x="760" y="368" class="label-b-bold">&#x2022; On new calendar event</text>
        <text x="760" y="380" class="label-es">&#x2022; Al agregar evento</text>
        <text x="780" y="396" class="label-sm">trip-related event added</text>
        <text x="780" y="407" class="label-es">evento de viaje al calendario</text>
      </g>

      <!-- STEP 7: Arrow + payoff box -->
      <g class="el" data-step="7">
        <path d="M 550 540 L 550 595" class="line" marker-end="url(#arrow)"/>
        <rect x="180" y="605" width="740" height="100" rx="12" class="box-finale"/>
        <text x="550" y="638" text-anchor="middle" class="label-h-white">Your prompting plan</text>
        <text x="550" y="654" text-anchor="middle" class="label-es-white">Tu plan de prompts</text>
        <text x="550" y="674" text-anchor="middle" class="label-b-white">Now you know what to ask the AI, what to feed it, and when to trigger it.</text>
        <text x="550" y="688" text-anchor="middle" class="label-es-white">Ya sabes qu&#xE9; pedirle a la IA, qu&#xE9; darle y cu&#xE1;ndo activarla.</text>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="hud">
    <div class="controls">
      <button id="prev">&#x2190; Prev</button>
      <button id="next">Next &#x2192;</button>
    </div>
    <div><strong id="counter">1</strong> / <span id="total">7</span></div>
  </div>
</div>
<div class="hint">&#x2190; &#x2192; arrow keys also work</div>

<script>
const captionsEN = [
  "Think like a designer. Before you build, plan the problem.",
  "Three questions. What's the OUTPUT I want? What's the INPUT that gets me there? And WHEN does it happen?",
  "Let's use a real one. We want to build a travel itinerary.",
  "OUTPUT: a travel itinerary. Maybe in a Google Doc. Maybe on a simple website. Pick the form first.",
  "INPUT: what feeds it? Airline reservations (from email or calendar). Calendar events. Travel preferences (where I like to stay, what I like to see).",
  "WHEN: on demand when I ask. Or automatically, when a new confirmation lands in my inbox or a trip event gets added to my calendar.",
  "Now you have a prompting plan. You know exactly what to ask the AI, what to give it, and when to trigger it. That's the design step."
];

const captionsES = [
  "Piensa como dise\xF1ador. Antes de construir, planea el problema.",
  "Tres preguntas. \xBFCu\xE1l es el RESULTADO que quiero? \xBFCu\xE1l es la ENTRADA que me lleva ah\xED? \xBFY CU\xC1NDO ocurre?",
  "Usemos uno real. Queremos construir un itinerario de viaje.",
  "RESULTADO: un itinerario de viaje. Quiz\xE1s en un Google Doc. Quiz\xE1s en un sitio sencillo. Elige la forma primero.",
  "ENTRADA: \xBFqu\xE9 lo alimenta? Reservas de vuelo (del email o calendario). Eventos de calendario. Preferencias de viaje (d\xF3nde me gusta hospedarme, qu\xE9 me gusta ver).",
  "CU\xC1NDO: a pedido cuando yo lo pido. O autom\xE1ticamente, cuando llega una nueva confirmaci\xF3n al correo o se agrega un evento de viaje al calendario.",
  "Ya tienes un plan de prompts. Sabes exactamente qu\xE9 pedirle a la IA, qu\xE9 darle y cu\xE1ndo activarla. Ese es el paso de dise\xF1o."
];

let mode = 'both';
let i = 0;
const titleScreen = document.getElementById("titleScreen");
const diagram = document.getElementById("diagram");
const cap = document.getElementById("caption");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

total.textContent = captionsEN.length;

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

function render() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#1a1a1a;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;

  if (i === 0) {
    titleScreen.style.display = '';
    diagram.style.display = 'none';
  } else {
    titleScreen.style.display = 'none';
    diagram.style.display = '';
    document.querySelectorAll('#diagram .el').forEach(el => {
      const step = parseInt(el.dataset.step);
      el.classList.toggle('show', step <= i + 1);
    });
  }

  document.querySelectorAll('#diagram .label-es, #diagram .label-es-white, #diagram .head-q-es').forEach(el => {
    el.style.display = (mode === 'en') ? 'none' : '';
  });
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") next.click();
  if (e.key === "ArrowLeft") prev.click();
});

render();
</script>
</body>
</html>
