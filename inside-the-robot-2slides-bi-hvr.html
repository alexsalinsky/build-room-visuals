<script>
const captionsEN = [
  "Zoom out. All of this together is the system.",
  "And out of that system, we build a product. Something you can use and share outside of the chat. A travel itinerary. An app. A virtual assistant. A WhatsApp digest."
];

const captionsES = [
  "Ampliemos la vista. Todo esto junto es el sistema.",
  "Y de ese sistema, construimos un producto. Algo que puedes usar y compartir fuera del chat. Un itinerario de viaje. Una app. Un asistente virtual. Un digest de WhatsApp."
];

let mode = 'both';
let i = 0;
const cap = document.getElementById('caption');
const counter = document.getElementById('counter');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const productEl = document.querySelector('[data-extract="9"]');

function setMode(m) {
  mode = m;
  document.body.className = 'mode-' + m;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');

  // Show/hide ES svg labels
  document.querySelectorAll('#diagram .label-es, #diagram .label-es-white').forEach(el => {
    el.style.display = (mode === 'en') ? 'none' : '';
  });
  renderCaption();
}

function renderCaption() {
  let html = '';
  if (mode === 'en') {
    html = '<span class="cap-en">' + captionsEN[i] + '</span>';
  } else if (mode === 'es') {
    html = '<span class="cap-es" style="color:#FFFFFF;font-style:normal;font-size:17px">' + captionsES[i] + '</span>';
  } else {
    html = '<span class="cap-en">' + captionsEN[i] + '</span><span class="cap-es">' + captionsES[i] + '</span>';
  }
  cap.innerHTML = html;
}

function render() {
  counter.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === captionsEN.length - 1;
  productEl.classList.toggle('show', i >= 1);
  renderCaption();
}

prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < captionsEN.length - 1) { i++; render(); } };

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') next.click();
  if (e.key === 'ArrowLeft') prev.click();
});

// Init ES label visibility
document.querySelectorAll('#diagram .label-es, #diagram .label-es-white').forEach(el => {
  el.style.display = '';
});

render();
</script>
